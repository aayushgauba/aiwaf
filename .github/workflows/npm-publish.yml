name: Publish JavaScript package to npm

on:
  push:
    tags:
      - "js-v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use current npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run test:coverage
          npm run test:wasm

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Stage shared package assets
        run: |
          cp ../README.md README.md
          cp ../LICENSE LICENSE
          cp ../NOTICE NOTICE
          cp -R ../licenses .
          mkdir -p geolock
          cp ../py/aiwaf/core/geolock/ipinfo_lite.mmdb geolock/ipinfo_lite.mmdb

      - name: Verify npm tarball contents
        run: |
          set -o pipefail
          npm pack --dry-run --json | node -e '
          const fs = require("fs");
          const result = JSON.parse(fs.readFileSync(0, "utf8"));
          const pack = Array.isArray(result) ? result[0] : result.aiwaf;
          if (!pack || !Array.isArray(pack.files)) {
            throw new Error(`npm pack returned no file list for aiwaf: ${JSON.stringify(result)}`);
          }
          const files = new Set(pack.files.map(file => file.path));
          const required = ["LICENSE", "NOTICE", "licenses/MIT.txt", "README.md", "geolock/ipinfo_lite.mmdb", "index.js", "package.json", "lib/sqlInjection.js"];
          const missing = required.filter(file => !files.has(file));
          if (pack.name !== "aiwaf" || missing.length || files.has("INSTALLATION.md")) {
            throw new Error(`Invalid npm package: ${pack.name}; missing ${missing.join(", ")}`);
          }
          console.log(`${pack.name}@${pack.version}: ${pack.files.length} files ready to stage`);
          '

      - name: Stage package for npm approval
        run: npm stage publish --access public
