[package]
name = "aiwaf-wasm"
version = "0.2.4"
edition = "2024"
license = "Elastic-2.0"
repository = "https://github.com/aiwaf-project/aiwaf"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aiwaf_core = { path = "../aiwaf_core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Window", "Navigator"] }
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
aiwaf_core = { path = "../aiwaf_core" }
