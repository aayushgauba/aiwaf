[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "aiwaf-rust"
version = "0.2.6"
description = "Rust-powered WAF heuristics exposed to Python via PyO3"
readme = "README.md"
requires-python = ">=3.8"
license = "Elastic-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [
  { name = "AIWAF maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Operating System :: OS Independent"
]

[project.urls]
Source = "https://github.com/aiwaf-project/aiwaf/tree/main/rust"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "aiwaf_rust"
include = [
  { path = "README.md", format = "sdist" },
  { path = "LICENSE", format = "sdist" },
  { path = "NOTICE", format = "sdist" },
  { path = "licenses/*.txt", format = "sdist" }
]
